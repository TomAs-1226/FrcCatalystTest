plugins {
    id "java"
    id "edu.wpi.first.GradleRIO" version "2026.2.1"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

def ROBOT_MAIN_CLASS = "frc.robot.Main"

deploy {
    targets {
        roborio(getTargetTypeClass('RoboRIO')) {
            team = project.frc.getTeamOrDefault(9999)
            debug = project.frc.getDebugOrDefault(false)
            artifacts {
                frcJava(getArtifactTypeClass('FRCJavaArtifact')) {
                }
                frcStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
                    files = project.fileTree('src/main/deploy')
                    directory = '/home/lvuser/deploy'
                    deleteOldFiles = false
                }
            }
        }
    }
}

def deployArtifact = deploy.targets.roborio.artifacts.frcJava

wpi.java.debugJni = false

def includeDesktopSupport = true

repositories {
    mavenLocal()
    mavenCentral()

    String publicFolder = System.getenv('PUBLIC') ?: 'C:\\Users\\Public'
    maven {
        name 'frcHome'
        url new File(publicFolder, 'wpilib/2026/maven')
    }
    maven { url "https://frcmaven.wpi.edu/artifactory/release/" }
    maven { url "https://maven.ctr-electronics.com/release/" }
    maven { url "https://maven.photonvision.org/repository/internal/" }
    maven { url "https://maven.photonvision.org/repository/snapshots/" }
    maven { url "https://3015rangerrobotics.github.io/pathplannerlib/repo" }
    maven { url "https://jitpack.io" }
}

dependencies {
    annotationProcessor wpi.java.deps.wpilibAnnotations()
    implementation wpi.java.deps.wpilib()
    implementation wpi.java.vendor.java()

    roborioDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.roborio)
    roborioDebug wpi.java.vendor.jniDebug(wpi.platforms.roborio)

    roborioRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.roborio)
    roborioRelease wpi.java.vendor.jniRelease(wpi.platforms.roborio)

    nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop)
    nativeDebug wpi.java.vendor.jniDebug(wpi.platforms.desktop)
    simulationDebug wpi.sim.enableDebug()

    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
    nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop)
    simulationRelease wpi.sim.enableRelease()

    // FrcCatalyst v1.3.2 (from JitPack — portable, builds anywhere).
    // Local-source alternative: run `./gradlew publishToMavenLocal` in the
    // FrcCatalyst repo, then use "com.frccatalyst:FrcCatalyst:1.3.2".
    implementation "com.github.TomAs-1226:FrcCatalyst:v1.3.2"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
    exclude '**/mechanisms/**'
    exclude '**/SlewRateLimiterTest*'
    exclude '**/TimedBooleanTest*'
    forkEvery = 1
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "short"
    }
}

tasks.register('testAll', Test) {
    useJUnitPlatform()
    classpath = tasks.test.classpath
    testClassesDirs = tasks.test.testClassesDirs
    forkEvery = 1
    // SlewRateLimiter and TimedBoolean wrap WPILib's Timer and only behave correctly
    // while the robot loop is advancing time (under simulateJava), not in a one-shot
    // JUnit call. Excluded here as well as from `test`; exercise them in simulation.
    exclude '**/SlewRateLimiterTest*'
    exclude '**/TimedBooleanTest*'
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "short"
    }
}

wpi.sim.addGui().defaultEnabled = true
wpi.sim.addDriverstation()

// Fat JAR — bundles ALL runtime deps into one jar so simulation and deploy work
jar {
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    from('src') { into 'backup/src' }
    from('vendordeps') { into 'backup/vendordeps' }
    from('build.gradle') { into 'backup' }
    manifest edu.wpi.first.gradlerio.GradleRIOPlugin.javaManifest(ROBOT_MAIN_CLASS)
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

deployArtifact.jarTask = jar
wpi.java.configureExecutableTasks(jar)
wpi.java.configureTestTasks(test)
// testAll runs the HAL/CTRE-sim mechanism tests too, so it needs the same native
// (WPILib HAL + CTRE Phoenix sim) setup that configureTestTasks wires in. Without this
// the mechanism test workers crash on the first hardware object (#nativeLibs).
wpi.java.configureTestTasks(tasks.testAll)

tasks.withType(JavaCompile) {
    options.compilerArgs.add '-XDstringConcat=inline'
    options.encoding = 'UTF-8'
}
